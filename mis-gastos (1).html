<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--br:#e3e6ea;--ac:#2563eb;--neg:#dc2626;--pos:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mut:#9aa3ad;--br:#2d343c;--ac:#60a5fa;--neg:#f87171;--pos:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2026;--tx:#eef0f3;--mut:#9aa3ad;--br:#2d343c;--ac:#60a5fa;--neg:#f87171;--pos:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;min-width:84px;max-width:140px;padding:10px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{font-size:1.1rem;font-weight:700;border:0;border-bottom:1px dashed var(--br);border-radius:0;padding:4px 0;background:transparent;margin-bottom:6px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:6px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:1rem}
.row{display:flex;gap:8px;margin-top:8px}
.row .sg{flex:0 0 70px}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:1rem}
.ini{color:var(--mut);font-size:.9rem}
.bal{font-size:2rem;font-weight:700;margin-top:2px}
.bal.n{color:var(--neg)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--br)}
li:first-child{border-top:0}
.d{font-size:.8rem;color:var(--mut)}
.m{font-weight:600;white-space:nowrap}
.m.neg{color:var(--neg)}.m.pos{color:var(--pos)}
.x{background:none;border:0;color:var(--mut);font-size:1.1rem;padding:4px 8px}
.reset{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.85rem;margin-top:8px;padding:0}
.empty{color:var(--mut);font-size:.9rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{margin:0;font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--br);background:var(--card);color:var(--tx);font-size:1.4rem;line-height:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:310px;background:var(--card);border-right:1px solid var(--br);transform:translateX(-100%);transition:transform .22s;z-index:21;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto}
.dr.open{transform:translateX(0)}
.dr h2{font-size:1rem;margin:4px 8px 12px;color:var(--mut);font-weight:600}
.it{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:10px;background:none;color:var(--tx);font-size:1rem;margin-bottom:4px}
.it.on{background:var(--bg);font-weight:700}
.it small{display:block;color:var(--mut);font-weight:400;font-size:.8rem;margin-top:2px}
</style>
</head>
<body>
<div class="top"><button class="hb" id="hb" aria-label="Menú">☰</button><h1 id="cur">💰 Mis gastos</h1></div>
<div class="ov" id="ov"></div>
<nav class="dr" id="dr"><h2>💰 Mis gastos</h2><div id="tabs"></div></nav>
<div id="app"></div>

<script>
var KEY = "misgastos:";
var IDS = ["semana", "salidas", "c3", "c4", "c5"];
var cur = "semana";
var titles = loadTitles();

function loadTitles(){
  try{ var r = localStorage.getItem(KEY + "titles"); if(r) return JSON.parse(r); }catch(e){}
  return {};
}
function saveTitles(){
  try{ localStorage.setItem(KEY + "titles", JSON.stringify(titles)); }catch(e){}
}
function nameOf(id){
  var t = titles[id];
  if(t && t.trim()) return t;
  return "Registro " + (IDS.indexOf(id) + 1);
}
function renderTabs(){
  document.getElementById("cur").textContent = nameOf(cur);
  document.getElementById("tabs").innerHTML = IDS.map(function(id){
    var d = load(id);
    var sub = d.inicial === null ? "Sin total aún" : "Saldo " + money(saldo(d));
    return '<button class="it' + (id === cur ? ' on' : '') + '" data-id="' + id + '">' + esc(nameOf(id)) + '<small>' + sub + '</small></button>';
  }).join("");
  document.querySelectorAll("#tabs .it").forEach(function(b){
    b.onclick = function(){ cur = b.dataset.id; toggle(false); render(); };
  });
}
function toggle(open){
  document.getElementById("dr").className = "dr" + (open ? " open" : "");
  document.getElementById("ov").className = "ov" + (open ? " open" : "");
}

function load(k){
  try{ var r = localStorage.getItem(KEY + k); if(r) return JSON.parse(r); }catch(e){}
  return { inicial: null, movs: [] };
}
function save(k, d){
  try{ localStorage.setItem(KEY + k, JSON.stringify(d)); }catch(e){}
}
function money(n){
  return "$" + Number(n).toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
}
function saldo(d){
  var s = d.inicial || 0;
  d.movs.forEach(function(m){ s += m.signo === "+" ? m.cant : -m.cant; });
  return s;
}

function render(){
  renderTabs();
  var d = load(cur);
  var h = "";
  if(d.inicial === null){
    h += '<div class="card">' + '<input id="ttl" class="ttl" type="text" maxlength="30" placeholder="Título (ej. Escuela, Salidas)" value="' + esc(titles[cur] || "") + '">' + '<label>Ingrese su total</label>' +
         '<input id="ini" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Ej. 200">' +
         '<button class="btn" id="setIni">Guardar total</button></div>';
  } else {
    var s = saldo(d);
    h += '<div class="card">' + '<input id="ttl" class="ttl" type="text" maxlength="30" placeholder="Título (ej. Escuela, Salidas)" value="' + esc(titles[cur] || "") + '">' + 
         '<div class="ini">Total inicial: <b>' + money(d.inicial) + '</b></div>' +
         '<div class="ini">Saldo actual</div>' +
         '<div class="bal' + (s < 0 ? " n" : "") + '">' + money(s) + '</div>' +
         '<button class="reset" id="reset">Empezar de nuevo</button></div>';
    h += '<div class="card"><label>Nuevo movimiento</label>' +
         '<input id="con" type="text" placeholder="¿En qué? Ej. cuernito">' +
         '<div class="row"><select id="sig" class="sg"><option value="-">−</option><option value="+">+</option></select>' +
         '<input id="can" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Cantidad, ej. 40"></div>' +
         '<button class="btn" id="add">Agregar</button></div>';
    h += '<div class="card"><label>Registro</label>';
    if(!d.movs.length){ h += '<div class="empty">Aún no hay movimientos.</div>'; }
    else {
      h += "<ul>";
      var run = d.inicial, rows = [];
      d.movs.forEach(function(m, i){
        run += m.signo === "+" ? m.cant : -m.cant;
        rows.push('<li><div><div>' + esc(m.con) + '</div><div class="d">' + esc(m.fecha) + ' · queda ' + money(run) + '</div></div>' +
          '<div><span class="m ' + (m.signo === "+" ? "pos" : "neg") + '">' + (m.signo === "+" ? "+" : "−") + money(m.cant) + '</span>' +
          '<button class="x" data-i="' + i + '" aria-label="Borrar">✕</button></div></li>');
      });
      h += rows.reverse().join("") + "</ul>";
    }
    h += "</div>";
  }
  document.getElementById("app").innerHTML = h;
  bind();
}

function bind(){
  var d = load(cur);
  var b;
  if((b = document.getElementById("ttl"))) b.oninput = function(){
    titles[cur] = document.getElementById("ttl").value; saveTitles(); renderTabs();
  };
  if((b = document.getElementById("setIni"))) b.onclick = function(){
    var v = parseFloat(document.getElementById("ini").value);
    if(isNaN(v) || v < 0) return;
    d.inicial = v; save(cur, d); render();
  };
  if((b = document.getElementById("add"))) b.onclick = function(){
    var c = parseFloat(document.getElementById("can").value);
    var con = document.getElementById("con").value.trim() || "Sin concepto";
    if(isNaN(c) || c <= 0) return;
    var f = new Date();
    d.movs.push({ con: con, cant: c, signo: document.getElementById("sig").value,
      fecha: f.toLocaleDateString("es-MX", {day:"numeric", month:"short"}) + " " + f.toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"}) });
    save(cur, d); render();
  };
  if((b = document.getElementById("reset"))) b.onclick = function(){
    if(confirm("¿Borrar todo este registro y empezar de nuevo?")){ save(cur, { inicial: null, movs: [] }); render(); }
  };
  document.querySelectorAll(".x").forEach(function(x){
    x.onclick = function(){ d.movs.splice(parseInt(x.dataset.i, 10), 1); save(cur, d); render(); };
  });
}

document.getElementById("hb").onclick = function(){ renderTabs(); toggle(true); };
document.getElementById("ov").onclick = function(){ toggle(false); };
render();
</script>
</body>
</html>
